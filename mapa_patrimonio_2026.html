    {name:"Bus Electrico Visita Vina (Bloque 2)",address:"Frontis Teatro Municipal, Vina del Mar",lat:-33.0252,lng:-71.5512,start:"12:00",end:"13:15",notes:"Recorrido patrimonial ludico",city:"Vina del Mar"},
    {name:"Bus Electrico Visita Vina (Bloque 3)",address:"Frontis Teatro Municipal, Vina del Mar",lat:-33.0252,lng:-71.5512,start:"15:00",end:"16:15",notes:"Recorrido patrimonial ludico",city:"Vina del Mar"}
  ]
};

var optimalOrder = {
  saturday: [1,2,0,3,4,5,6,7,8],
  sunday: [0,3,4,5,2,1]
};

var tips = {
  saturday: "Recomendacion: empieza temprano en calle Prat (Valparaiso) y cruza a Vina del Mar antes de las 10:00 para alcanzar el Palacio Cerro Castillo y los buses electricos.",
  sunday: "Recomendacion: parte en el Castillo Brunet (Vina del Mar) temprano. Los grupos folcloricos son a las 12:00 y 14:30. Luego cruza a Valparaiso para cerrar en la Armada y BancoEstado."
};

var map = L.map('map',{center:[-33.034,-71.59],zoom:14,zoomControl:false});
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OSM &copy; CARTO',maxZoom:19
}).addTo(map);

var valpoIcon = L.divIcon({className:'',html:'<div class="city-label valpo">Valparaiso</div>',iconSize:[100,24],iconAnchor:[50,12]});
var vinaIcon = L.divIcon({className:'',html:'<div class="city-label vina">Vina del Mar</div>',iconSize:[100,24],iconAnchor:[50,12]});
L.marker([-33.045,-71.620],{icon:valpoIcon,interactive:false}).addTo(map);
L.marker([-33.015,-71.552],{icon:vinaIcon,interactive:false}).addTo(map);

var currentDay = 'saturday';
var currentMode = 'car';
var markers = [];
var routeControl = null;

function createIcon(idx,day,isFirst,isLast,count){
  var base = day==='saturday'?'#f59e0b':'#8b5cf6';
  var bg = base;
  if(isFirst) bg='#22c55e';
  if(isLast) bg='#ef4444';
  var txt = (day==='sunday'&&!isFirst&&!isLast)?'white':'#1e293b';
  var sz = count>1?38:32;
  var badge = count>1?'<div style="position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#3b82f6;color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #1e293b">'+count+'</div>':'';
  return L.divIcon({
    className:'custom-marker',
    html:'<div style="width:'+sz+'px;height:'+sz+'px;background:'+bg+';border-radius:50%;display:flex;align-items:center;justify-content:center;color:'+txt+';font-family:Inter,sans-serif;font-weight:700;font-size:'+(count>1?14:13)+'px;border:3px solid rgba(255,255,255,0.9);box-shadow:0 4px 14px rgba(0,0,0,0.5),0 0 0 4px '+bg+'33;position:relative;">'+(idx+1)+badge+'</div>',
    iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],popupAnchor:[0,-sz/2-4]
  });
}

function haversine(a,b){
  var R=6371;var dLat=(b.lat-a.lat)*Math.PI/180;var dLng=(b.lng-a.lng)*Math.PI/180;
  var x=Math.pow(Math.sin(dLat/2),2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.pow(Math.sin(dLng/2),2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function getUniqueWPs(dayData,order){
  var seen={};var wps=[];
  for(var i=0;i<order.length;i++){
    var a=dayData[order[i]];var key=a.lat.toFixed(4)+','+a.lng.toFixed(4);
    if(!seen[key]){seen[key]=true;wps.push(a);}
  }
  return wps;
}

function renderDay(day){
  markers.forEach(function(m){map.removeLayer(m)});
  markers=[];
  if(routeControl){map.removeControl(routeControl);routeControl=null;}

  var dayData=activities[day];
  var order=optimalOrder[day];
  var color=day==='saturday'?'#f59e0b':'#8b5cf6';
  var cls=day==='saturday'?'':'purple';
  var uniqueWPs=getUniqueWPs(dayData,order);
  var ordered=order.map(function(idx,step){var a=dayData[idx];return {name:a.name,address:a.address,lat:a.lat,lng:a.lng,start:a.start,end:a.end,notes:a.notes,city:a.city,step:step};});

  var locMap={};var locOrder=[];
  ordered.forEach(function(a){
    var key=a.lat.toFixed(4)+','+a.lng.toFixed(4);
    if(!locMap[key]){locMap[key]={lat:a.lat,lng:a.lng,acts:[a]};locOrder.push(key);}
    else locMap[key].acts.push(a);
  });
  var locs=locOrder.map(function(k){return locMap[k]});

  locs.forEach(function(loc,mi){
    var isFirst=mi===0,isLast=mi===locs.length-1;
    var icon=createIcon(mi,day,isFirst,isLast,loc.acts.length);
    var html='<div class="popup-content">';
    html+='<div class="popup-badge '+cls+'">Parada '+(mi+1)+' de '+locs.length+'</div>';
    loc.acts.forEach(function(a,ai){
      if(ai>0) html+='<div class="popup-sep"></div>';
      html+='<div class="popup-title">'+a.name+'</div>';
      html+='<div class="popup-addr">'+a.address+'</div>';
      html+='<div class="popup-time '+cls+'">'+a.start+' &ndash; '+a.end+'</div>';
      if(a.notes) html+='<div class="popup-notes">'+a.notes+'</div>';
    });
    html+='<a class="popup-gmaps" href="https://www.google.com/maps/dir/?api=1&destination='+loc.lat+','+loc.lng+'" target="_blank" rel="noopener">Abrir en Google Maps</a>';
    html+='</div>';
    var m=L.marker([loc.lat,loc.lng],{icon:icon}).addTo(map).bindPopup(html,{maxWidth:300});
    markers.push(m);
  });

  var waypoints=uniqueWPs.map(function(w){return L.latLng(w.lat,w.lng)});
  routeControl=L.Routing.control({
    waypoints:waypoints,
    router:L.Routing.osrmv1({serviceUrl:'https://router.project-osrm.org/route/v1',profile:currentMode==='car'?'car':'foot'}),
    lineOptions:{styles:[{color:'rgba(0,0,0,0.35)',opacity:1,weight:8},{color:color,opacity:0.8,weight:5,dashArray:'10,8'}],addWaypoints:false},
    createMarker:function(){return null},addWaypoints:false,fitSelectedRoutes:false,show:false
  }).addTo(map);

  routeControl.on('routesfound',function(e){
    var r=e.routes[0];
    var km=(r.summary.totalDistance/1000).toFixed(1);
    var mins=Math.round(r.summary.totalTime/60);
    document.querySelector('#statDistance .value').textContent=km+' km';
    document.querySelector('#statDistance .value').style.color=color;
    document.querySelector('#statTime .value').textContent=mins+' min';
    document.querySelector('#statTime .value').style.color=color;
  });

  document.querySelector('#statActivities .value').textContent=dayData.length;
  document.querySelector('#statActivities .value').style.color=color;
  document.querySelector('#statStops .value').textContent=locs.length;
  document.querySelector('#statStops .value').style.color=color;
  var t0=ordered[0].start,t1=ordered[ordered.length-1].end;
  document.querySelector('#statHours .value').textContent=t0+' - '+t1;
  document.querySelector('#statHours .value').style.color=color;

  var dayLabel=day==='saturday'?'Sabado 30':'Domingo 31';
  document.getElementById('sidebarTitle').textContent='Itinerario - '+dayLabel;
  var tipEl=document.getElementById('sidebarTip');
  tipEl.textContent=tips[day];
  tipEl.className='tip'+(day==='sunday'?' purple':'');

  var listEl=document.getElementById('activityList');
  listEl.innerHTML='';
  var cardIdx=0;

  locs.forEach(function(loc,li){
    if(li>0){
      var prev=locs[li-1];
      var dist=haversine(prev,loc);
      var walkMin=Math.round(dist/4.5*60);
      var carMin=Math.max(1,Math.round(dist/25*60));
      var seg=document.createElement('div');
      seg.className='travel-seg';
      var time=currentMode==='car'?carMin:walkMin;
      var modeLabel=currentMode==='car'?'en auto':'caminando';
      seg.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> '+dist.toFixed(1)+' km &middot; ~'+time+' min '+modeLabel;
      listEl.appendChild(seg);
    }
    loc.acts.forEach(function(a){
      var card=document.createElement('div');
      card.className='activity-card'+(cls?' purple':'');
      var cityBadge=a.city==='Valparaiso'?'<span class="card-badge city-valpo">Valparaiso</span>':'<span class="card-badge city-vina">Vina del Mar</span>';
      card.innerHTML='<div class="card-step '+cls+'">'+(cardIdx+1)+'</div><div class="card-name">'+a.name+'</div><div class="card-meta"><span class="card-badge time '+cls+'">'+a.start+' - '+a.end+'</span>'+cityBadge+'</div><div class="card-address">'+a.address+'</div>'+(a.notes?'<div class="card-notes">'+a.notes+'</div>':'');
      card.addEventListener('click',function(){
        map.setView([a.lat,a.lng],16);
        markers.forEach(function(m){
          var p=m.getLatLng();
          if(Math.abs(p.lat-a.lat)<0.001&&Math.abs(p.lng-a.lng)<0.001) m.openPopup();
        });
      });
      listEl.appendChild(card);
      cardIdx++;
    });
  });

  map.fitBounds(L.latLngBounds(waypoints).pad(0.15));
}

function switchDay(day){
  currentDay=day;
  document.getElementById('btnSat').className=day==='saturday'?'day-btn active-sat':'day-btn';
  document.getElementById('btnSun').className=day==='sunday'?'day-btn active-sun':'day-btn';
  renderDay(day);
}

function switchMode(mode){
  currentMode=mode;
  document.getElementById('btnCar').className=mode==='car'?'mode-btn active':'mode-btn';
  document.getElementById('btnWalk').className=mode==='foot'?'mode-btn active':'mode-btn';
  renderDay(currentDay);
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

function openShare(){document.getElementById('shareOverlay').classList.add('open');setupShareLinks()}
function closeShare(){document.getElementById('shareOverlay').classList.remove('open')}

function setupShareLinks(){
  var url=window.location.href;
  var text='Mira este mapa interactivo del Dia del Patrimonio 2026 en Valparaiso y Vina del Mar';
  document.getElementById('shareWA').href='https://wa.me/?text='+encodeURIComponent(text+' '+url);
  document.getElementById('shareTG').href='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text);
}

function copyLink(){
  var url=window.location.href;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(showToast);
  }else{
    var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast();
  }
  closeShare();
}

function showToast(){
  var t=document.getElementById('copiedToast');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200);
}

renderDay('saturday');
</script>
